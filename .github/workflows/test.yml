name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs get a read-only token, so outside code can't write to the repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Run tests
        run: python3 -m unittest discover tests -v
